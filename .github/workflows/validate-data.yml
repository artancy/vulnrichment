name: Validate data

# pull_request_target runs this workflow, the validator and the schema from the base branch,
# so a pull request cannot weaken its own check. The PR is only read as git data, never executed.
on:
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install validator
        run: npm install --no-save --no-package-lock ajv@8 ajv-formats@3 ajv-errors@3

      - name: Fetch pull request commits
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "refs/pull/$PR_NUMBER/head"

      - name: Validate changed files and commits
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/validate-data.js "$BASE_SHA" "$HEAD_SHA"

      - name: Validate all files
        if: github.event_name == 'workflow_dispatch'
        run: node .github/scripts/validate-data.js
